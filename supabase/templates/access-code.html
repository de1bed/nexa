<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f1f5f9;padding:24px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">
    <span style="display:none;font-size:1px;color:#f1f5f9">Tu código de acceso a NEXA VISIT.</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 18px 48px -28px rgba(7,20,38,.45)">
            <tr>
              <td style="background:#071426;padding:22px 28px">
                <span style="display:inline-block;width:30px;height:30px;background:#10cfc9;border-radius:9px;vertical-align:middle"></span>
                <span style="color:#ffffff;font-size:13px;font-weight:600;letter-spacing:.18em;margin-left:10px;vertical-align:middle">NEXA VISIT</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 28px 34px">
                <h1 style="margin:0;font-size:24px;line-height:32px;font-weight:600;color:#071426;letter-spacing:-.02em">Tu código de acceso</h1>
                <p style="margin:14px 0 0;font-size:16px;line-height:26px;color:#334155">
                  Escríbelo en la pantalla de acceso para entrar. Vence en una hora y solo sirve una vez.
                </p>
                <p style="margin:26px 0;padding:20px;background:#f1f5f9;border-radius:16px;text-align:center;font-size:38px;font-weight:700;letter-spacing:.22em;color:#071426">{{ .Token }}</p>
                <p style="margin:0;font-size:12px;line-height:20px;color:#64748b">
                  Si no pediste este código, ignora el mensaje: sin él nadie puede entrar a tu cuenta.
                </p>
              </td>
            </tr>
          </table>
          <p style="max-width:520px;color:#64748b;font-size:11px;line-height:18px;padding:16px 6px 0;text-align:center">
            NEXA VISIT · Control inteligente de accesos
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
